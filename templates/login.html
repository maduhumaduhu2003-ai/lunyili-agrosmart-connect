{% extends 'base.html' %}

{% block title %}Login - AgroSmart Connect{% endblock %}

{% block content %}
<div class="row justify-content-center" style="min-height: 80vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 mt-5">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> Welcome Back</h4>
                <small>Sign in to your account</small>
            </div>
            <div class="card-body p-4">
                <form
                    method="post"
                    data-loading="true"
                    data-loading-title="Signing In"
                    data-loading-message="Checking your account..."
                >
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            {{ form.username }}
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            {{ form.password }}
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 py-2">
                        <i class="bi bi-box-arrow-in-right"></i> Sign In
                    </button>
                </form>
                
                <hr>
                
                <div class="text-center">
                    <p class="mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-success fw-bold">Register</a></p>
                    <small class="text-muted">
                        <a href="#" class="text-decoration-none">Forgot password?</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
